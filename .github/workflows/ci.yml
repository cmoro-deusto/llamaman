name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build (binaries needed by integration tests)
        run: |
          mkdir -p bin
          go build -o bin/llamaman .
          go build -o bin/llamaman-fakeserver ./cmd/llamaman-fakeserver
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
