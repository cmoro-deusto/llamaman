name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not reachable from origin/main."
            echo "::error::Releases must be cut from main. Aborting."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install C toolchain (CGO + arm64 cross)
        run: |
          sudo apt-get update -y
          # `gcc-aarch64-linux-gnu` is the cross-compiler binary;
          # `libc6-dev-arm64-cross` is its matching libc headers
          # (without it, every CGO arm64 build fails with
          # `bits/libc-header-start.h: No such file or directory`).
          sudo apt-get install -y --no-install-recommends \
            gcc \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        continue-on-error: true
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_STAGING_KEY: ${{ secrets.AUR_STAGING_KEY }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      - name: Upload PKGBUILD and dist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llamaman-dist-${{ github.ref_name }}
          path: |
            dist/**
          if-no-files-found: warn
          retention-days: 14
      - name: Create and upload AUR tarball to GitHub release
        if: always()
        run: |
          TAG="${{ github.ref_name }}"
          # GoReleaser writes AUR files to dist/aur/
          AURDIR="dist/aur"
          if [ ! -d "$AURDIR" ]; then
            echo "::warning::No AUR directory found in dist, skipping AUR tarball"
            exit 0
          fi
          mkdir -p aur-pkg
          # GoReleaser names files with .pkgbuild / .srcinfo extensions
          cp "$AURDIR"/*.pkgbuild "$AURDIR"/*.srcinfo aur-pkg/ 2>/dev/null || true
          # Also include any generated PKGBUILD without extension if present
          cp "$AURDIR"/PKGBUILD "$AURDIR"/.SRCINFO aur-pkg/ 2>/dev/null || true
          if [ -z "$(ls -A aur-pkg 2>/dev/null)" ]; then
            echo "::warning::No AUR files found to package, skipping"
            exit 0
          fi
          tar -czf "llamaman-bin-${TAG}-aur.tar.gz" -C aur-pkg .
          echo "Uploading AUR tarball to release $TAG"
          gh release upload "$TAG" "llamaman-bin-${TAG}-aur.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
