name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not reachable from origin/main."
            echo "::error::Releases must be cut from main. Aborting."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install C toolchain (CGO + arm64 cross)
        run: |
          sudo apt-get update -y
          # `gcc-aarch64-linux-gnu` is the cross-compiler binary;
          # `libc6-dev-arm64-cross` is its matching libc headers
          # (without it, every CGO arm64 build fails with
          # `bits/libc-header-start.h: No such file or directory`).
          sudo apt-get install -y --no-install-recommends \
            gcc \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_STAGING_KEY: ${{ secrets.AUR_STAGING_KEY }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
