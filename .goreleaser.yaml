version: 2

project_name: llamaman

before:
  hooks:
    - go mod tidy

builds:
  - id: llamaman
    main: .
    binary: llamaman
    env:
      - CGO_ENABLED=1
      - "{{- if eq .Arch \"amd64\" }}CC=gcc{{- else if eq .Arch \"arm64\" }}CC=aarch64-linux-gnu-gcc{{- end }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

  - id: llamaman-fakeserver
    main: ./cmd/llamaman-fakeserver
    binary: llamaman-fakeserver
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: llamaman
    ids: [llamaman]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: cmoro-deusto
    name: llamaman
  draft: false
  prerelease: auto

aurs:
  - name: llamaman-bin
    ids: [llamaman]
    homepage: "https://github.com/cmoro-deusto/llamaman"
    description: "TUI manager for llama-server (llama.cpp). Pre-built binary release."
    maintainers:
      - "Carlos Moro <carlos@gondor.es>"
    license: "MIT"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/llamaman-bin.git"
    skip_upload: auto
    provides: ["llamaman"]
    conflicts: ["llamaman"]
    optdepends:
      - "wl-clipboard: clipboard support on Wayland"
      - "xclip: clipboard support on X11"
      - "llama.cpp: provides the llama-server binary"
      - "nvidia-utils: live NVIDIA GPU stats in the run-mode Hardware panel"
    commit_msg_template: "Update to {{ .Tag }}"
    package: |-
      install -Dm755 "./llamaman" "${pkgdir}/usr/bin/llamaman"
      [ -f LICENSE ]   && install -Dm644 LICENSE   "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
      [ -f README.md ] && install -Dm644 README.md "${pkgdir}/usr/share/doc/${pkgname}/README.md"

      install -d "${pkgdir}/usr/share/bash-completion/completions"
      install -d "${pkgdir}/usr/share/zsh/site-functions"
      install -d "${pkgdir}/usr/share/fish/vendor_completions.d"
      "${pkgdir}/usr/bin/llamaman" --completion bash > "${pkgdir}/usr/share/bash-completion/completions/llamaman" || true
      "${pkgdir}/usr/bin/llamaman" --completion zsh  > "${pkgdir}/usr/share/zsh/site-functions/_llamaman"      || true
      "${pkgdir}/usr/bin/llamaman" --completion fish > "${pkgdir}/usr/share/fish/vendor_completions.d/llamaman.fish" || true
